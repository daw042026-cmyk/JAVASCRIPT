<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var num = prompt("Intruduce un número: ")
        const verParImpar = (numero) => {
            if (numero % 2 === 0){
                alert("El número es par")
            } else{
                alert("Es impar")
            }
        }
        verParImpar(num)
    </script>
</body>
</html>
