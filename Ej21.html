<!DOCTYPE html>

<html>
<head><title>Ejemplo aprenderaprogramar.com</title>
<meta charset="utf-8">

<style type="text/css">
body {margin-left:30px; font-family: sans-serif;}

.estiloForm {background-color: #f3f3f3; border: solid 2px black; margin-left:20px; width: 330px; padding:10px; }

.estiloForm label {display: block; width: 120px; float: left; text-align:right; margin-bottom: 35px; padding-right: 20px;}

br {clear: left;} input[type="submit"], input[type="reset"] {margin:25px 5px 10px 5px;}

</style>

<script type="text/javascript">

window.onload = function () {
    const elementosInputs = document.getElementsByTagName('input');
    const elementosSelects = document.getElementsByTagName('select');

    let arrayNodos = [];

    for(let i = 0; i < elementosInputs.length; i++){
        arrayNodos.push(elementosInputs[i]);
    }
    
    for(let j = 0; j < elementosSelects.length; j++){
        arrayNodos.push(elementosSelects[j]);
    }

    console.log(arrayNodos.length);
    console.log(elementosInputs.length);
    console.log(elementosSelects.length);
    console.log(arrayNodos);
    console.log(elementosInputs);
    console.log(elementosSelects);


 //Construir un único elemento arrayNodos con todos los input y después los select
 // Pasamos de un NodeList que es un array-like a un Array, manualmente:
 // Recorrer el vector de nodos uno a uno e ir copiándolos a un nuevo 
 // vector con el método push
}

</script></head>

<body><h2>Cursos aprenderaprogramar.com</h2><h3>Ejemplos JavaScript</h3>

    <div class="estiloForm"> 
    	<form name ="formularioContacto" method="get" action="#">

                               <input type="radio" name="tratamiento" id ="tratarSra" value="Sra."/>Sra.<br/>

                               <label>Nombre</label><input id="nombre" name="nombre" type="text"/><br/>

        <label>Apellidos</label><input id="apellidos" name="apellidos" type="text"/><br/>

        <label>Dirección</label><input id="direccion1" name="direccion1" type="text"/><br/>

        <label>Ciudad</label><select id="ciudad" name="ciudad">

            <option value="Mexico">México D.F. (MX)</option>

            <option value="Santiago">Santiago (CL)</option>

        </select><br/>

        <label>Preferencias</label><input name="Libros" type="checkbox" />Libros

    </form></div>
</body></html>
