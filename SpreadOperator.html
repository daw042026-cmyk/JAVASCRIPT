<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const person = {
            name: 'Jane',
            age: 21,
            hobbies: ['sports'],
        };

        const {name, ...spread} = person;
        console.log(name, spread);

        const myArr = [1,2,3,4,5];

        const [first, ...spreadItems] = myArr;

        console.log(first, spreadItems);

        const add = (...args) => {
            return args.reduce((acc, currValue) => acc + currValue, 0);
        };

        const result = add(1);
        const resultTwo = add(2, 3, 4);
        const resultThree = add(1, 2, 3, 5, 7);
        console.log(result, resultTwo, resultThree);
    </script>
</body>
</html>
