<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num1 = parseFloat(eval(prompt("Introduce un número: ")));
        let num2 = parseFloat(eval(prompt("Introduce el segundo número: ")));
        let opcion = prompt("Introduce la operación que desea realizar: ");
        switch(opcion){
            case "-":
                console.log(num1-num2);
                break;
            case "+":
                console.log(num1+num2);
                break;
            case "*":
                console.log(num1*num2);
                break;
            case "/":
                if(num2!==0){
                console.log(num1/num2);
                } else{
                    console.log("No se puede dividir por 0")
                }
                break;
            default:
                console.log("Operación no permitida")
        }
    </script>
</body>
</html>
