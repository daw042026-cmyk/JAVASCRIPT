<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Variables JavaScript</title>

    <script>
        // Variables en JavaScript:
        // Fuera de una función, aunque lleve var será global.
        // Dentro de una función, si lleva var será local.
        if (true) {
            var true_global = 1;
        }
        if (false) {
            var false_global = 1;
        }
        var sum = function() {
            var local = 1;
            is_it_local = 3;
            console.log(true_global);
            return true_global + local + is_it_local;
        };
        alert("True global: " + true_global);
        alert("False global: " + false_global);
        alert("Resultado de sum(): " + sum());
        document.write("Resultado de sum(): " + sum());
    </script>
</head>

<body>
</body>
</html>
