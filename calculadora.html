<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #Caja{
            border: 3px, solid; text-align: left; height: 500px;
            border-radius: 4px; margin-right: 1490px; margin-left: 60px;
            margin-top: 30px;
            background-color: rgb(128, 230, 255);
        }

        #Resultero{
            border: 3px, solid; padding-top: 40px; margin-left: 10px;
            margin-right: 10px; margin-top: 10px; padding-top: 60px;
            border-radius: 4px; background-color: aliceblue;
        }

        button{
            border: 2px, solid; margin-top: 20px; margin-left: 10px;border-radius: 4px; height: 60px; width: 60px;
            margin-right: 12px; color: aliceblue;
            justify-content: center; font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: 30px; display: inline; align-items: center; background-color: rgb(59, 98, 129);
        }

        button:hover{
            background-color: blue;
        }

        #Tapa{
            border:3px, solid; margin-top: 30px; background-color: rgb(93, 116, 116); height: 72px;border-radius: 4px;
        }
    </style>
</head>
<body >
    <div id="Caja" name="Caja">
        <div id="Resultero" name="Resultero"></div>
        <button type="button">C</button>
        <button type="button">+</button>
        <button type="button">-</button>
        <button type="button">*</button>
        <button type="button">/</button>
        <button type="button">0</button>
        <button type="button">1</button>
        <button type="button">2</button>
        <button type="button">3</button>
        <button type="button">4</button>
        <button type="button">5</button>
        <button type="button">6</button>
        <button type="button">7</button>
        <button type="button">8</button>
        <button type="button">9</button>
        <button type="button">=</button>
        <div id="Tapa" name="Tapa"></div>
    </div>

    <script>
        const botones = document.querySelectorAll("button");
        const resultero = document.getElementById("Resultero");
        
        botones.forEach(boton => {
            boton.addEventListener("click", () => {
                const textoBoton = boton.innerText;
                if (textoBoton === "="){
                    resultero.innerText = eval(resultero.innerText);
                } else if (textoBoton === "C"){
                    resultero.innerText = "";
                } else {
                    resultero.innerText += textoBoton;
                }
            })
        })
    </script>
</body>
</html>
