<!DOCTYPE html>
<html>

<head>
    <style>
        div {
            background-color: coral;
            border: 1px solid;
            padding: 50px;
        }

        p {
            background-color: white;
            border: 1px solid;
            padding: 10px;
        }
    </style>
</head>

<body>

    <p>This example demonstrates the difference between bubbling and capturing when adding event listeners.
        Tercer parámetro a false es bubbling
        Tercer parámetro a true es capturing
    </p>

    <div id="myDiv">
        <p id="myP">Click this paragraph, I am Bubbling.</p>
    </div><br>

    <div id="myDiv2">
        <p id="myP2">Click this paragraph, I am Capturing.</p>
    </div>

    <script>
        document.getElementById("myDiv").addEventListener("click", function () {
            alert("You clicked the DIV element! " + this.id);
        }, false);

        document.getElementById("myP").addEventListener("click", function () {
            alert("You clicked the P element! " + this.id);
        }, false);

        document.getElementById("myP2").addEventListener("click", function () {
            alert("You clicked the P element! " + this.id);
        }, true);
    </script>

</body>
</html>
