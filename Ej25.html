        class LinkedList {

        }
        getLast() {
            let lastNode = this.head;
            if (lastNode) {
                while (lastNode.next) {
                    lastNode = lastNode.next;
                }
            }
            return lastNode;
        }
        size() {
        let count = 0;
        let node = this.head;
        while (node) {
            count++;
            node = node.next;
        }
        return count;
    }
}
