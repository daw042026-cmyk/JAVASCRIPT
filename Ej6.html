<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lower and upper</title>
</head>
<body>
    <script type="text/javascript">
        function message(){
            alert("Soy en minúscula")
        }
        function Message(){
            alert("Soy en Mayúscula")
        }
    </script>
    <h2>Esta es la diferencia</h2>
    <span>Lowercase:</span><input type="button" onclick="message()" value="Pulse Min"><br>
    <span>Uppercase:</span><input type="button" onclick="Message()" value="Pulse May">
</body>
</html>
